<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chatore Sathi Cafe</title>
<style>
html,body{margin:0;height:100%;background:#2b1a00;color:#f5e6c0;font-family:Georgia,serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
img{width:160px;height:160px;border-radius:50%;border:4px solid #c8860a;animation:pulse 2s infinite ease-in-out}
@keyframes pulse{0%{transform:scale(.95);box-shadow:0 0 0 0 rgba(200,134,10,.7)}70%{transform:scale(1);box-shadow:0 0 0 15px rgba(200,134,10,0)}100%{transform:scale(.95);box-shadow:0 0 0 0 rgba(200,134,10,0)}}
h1{font-size:1.4rem;color:#f5c842;margin:18px 0 14px}
.bar{width:200px;height:6px;background:#1a1000;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#f5c842;animation:ld 2s forwards cubic-bezier(.1,.8,.2,1)}
@keyframes ld{to{width:100%}}
#msg{margin-top:18px;font:14px sans-serif;color:#bfa17c;min-height:20px}
#msg a,#msg button{color:#f5c842;background:none;border:none;font:inherit;text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<img src="logo.png" alt="Chatore Sathi Cafe">
<h1>Chatore Sathi Cafe</h1>
<div class="bar"><i></i></div>
<div id="msg"></div>
<script>
var TARGET = "https://menu-api-arv5.onrender.com/api/app";
var MIN_MS = 2000;                 // how long the splash stays visible
var msg = document.getElementById('msg');
function go(){ window.location.replace(TARGET); }
function start(){
  if (navigator.onLine === false) {
    msg.innerHTML = 'No internet connection. <button onclick="location.reload()">Retry</button>';
    window.addEventListener('online', function(){ location.reload(); });
    return;
  }
  setTimeout(go, MIN_MS);
  setTimeout(function(){
    msg.innerHTML = 'Taking longer than usual... <a href="' + TARGET + '">Open now</a>';
  }, 8000);
}
start();
</script>
</body>
</html>
